[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scorepilot"
version = "0.1.0"
description = "A production-grade Python pipeline to collect exam questions and mark schemes and produce structured AI training datasets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "ScorePilot Team", email = "info@scorepilot.ai" }
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "pdfplumber>=0.10.3",
    "PyMuPDF>=1.23.21",
    "paddleocr>=2.7.3",
    "requests>=2.31.0",
    "aiohttp>=3.9.3",
    "beautifulsoup4>=4.12.3",
    "tqdm>=4.66.2",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "pillow>=10.2.0",
    "lxml>=5.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.2",
    "pytest-asyncio>=0.23.5",
    "black>=24.2.0",
    "ruff>=0.2.2",
    "mypy>=1.8.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "C90", "I", "N", "UP", "B", "A", "PT"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
