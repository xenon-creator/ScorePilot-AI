version: '3.8'

services:
  # Relational Database Storage
  db:
    image: postgres:15-alpine
    container_name: aegis-postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aegis_grading
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aegis_network

  # Redis In-Memory Message Broker & Cache
  redis:
    image: redis:7-alpine
    container_name: aegis-redis-broker
    restart: always
    ports:
      - "6379:6379"
    networks:
      - aegis_network

  # MinIO S3 Object Storage Service
  minio:
    image: minio/minio
    container_name: aegis-minio-s3
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - aegis_network

  # API Gateway & Core NLP Engine REST Endpoint
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegis-fastapi-backend
    restart: always
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=aegis_grading
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=super-secret-aegis-grading-key-2026
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=exam-papers
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - minio
    networks:
      - aegis_network

  # Asynchronous Background Worker Queue
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegis-celery-worker
    command: celery -A app.workers.tasks.celery_app worker --loglevel=info
    restart: always
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=aegis_grading
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=exam-papers
    depends_on:
      - redis
      - db
      - minio
    networks:
      - aegis_network

  # ScorePilot AI Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegis-nextjs-frontend
    restart: always
    ports:
      - "80:3000"
    depends_on:
      - backend
    networks:
      - aegis_network

volumes:
  postgres_data:
  minio_data:

networks:
  aegis_network:
    driver: bridge
