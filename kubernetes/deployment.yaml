apiVersion: v1
kind: Namespace
metadata:
  name: aegis-grading

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-config
  namespace: aegis-grading
data:
  DB_HOST: "aegis-postgres"
  DB_USER: "postgres"
  DB_NAME: "aegis_grading"
  REDIS_URL: "redis://aegis-redis:6379/0"

---
# 1. PostgreSQL DB Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-postgres
  namespace: aegis-grading
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "postgres"
        - name: POSTGRES_DB
          value: "aegis_grading"
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: pgdata
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: aegis-postgres
  namespace: aegis-grading
spec:
  ports:
  - port: 5432
  selector:
    app: postgres

---
# 2. Redis Message Broker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-redis
  namespace: aegis-grading
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: aegis-redis
  namespace: aegis-grading
spec:
  ports:
  - port: 6379
  selector:
    app: redis

---
# 3. FastAPI Python Backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-backend
  namespace: aegis-grading
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: aegis-grading-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: aegis-config
        env:
        - name: DB_PASSWORD
          value: "postgres"
        - name: JWT_SECRET
          value: "super-secret-aegis-grading-key-2026"

---
apiVersion: v1
kind: Service
metadata:
  name: aegis-backend-service
  namespace: aegis-grading
spec:
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: backend

---
# 4. Celery Async Worker Queue
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-worker
  namespace: aegis-grading
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: aegis-grading-backend:latest
        imagePullPolicy: Never
        command: ["celery", "-A", "app.workers.tasks.celery_app", "worker", "--loglevel=info"]
        envFrom:
        - configMapRef:
            name: aegis-config
        env:
        - name: DB_PASSWORD
          value: "postgres"

---
# 5. Next.js Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-frontend
  namespace: aegis-grading
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: aegis-grading-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://aegis-backend-service:8000"

---
apiVersion: v1
kind: Service
metadata:
  name: aegis-frontend-service
  namespace: aegis-grading
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: frontend

